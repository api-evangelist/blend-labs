aid: blend-labs
name: Blend Labs
description: >-
  Blend Labs, Inc. (NYSE: BLND) is a cloud banking platform, founded in 2012 and
  headquartered in the San Francisco Bay Area, that powers digital lending and account
  opening for banks, credit unions, and mortgage lenders. The Blend API lets integrators
  drive the full home-lending lifecycle — creating and exporting mortgage applications
  (with MISMO 3.3.1 and Fannie 3.2 export), managing parties, documents and disclosures,
  e-signature packages, and electronic/RON closings — as well as consumer lending,
  deposit account opening, verification of income/employment/assets, tax transcripts,
  lender user management, reporting, and event notifications. Requests authenticate with
  an OAuth token, HTTP bearer, or basic credentials plus a mandatory blend-target-instance
  tenant header, against production (api.blendlabs.com) or beta (api.beta.blendlabs.com).
